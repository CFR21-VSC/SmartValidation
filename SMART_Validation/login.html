<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMART Validation — Acceso</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(200,146,26,0.08) 0%, transparent 60%),
                linear-gradient(160deg, #06101E 0%, #0B2341 60%, #071528 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #dde6f0;
        }

        .card {
            background: rgba(11,35,65,0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(200,146,26,0.25);
            border-top: 2px solid rgba(200,146,26,0.6);
            border-radius: 14px;
            padding: 48px 44px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow:
                0 24px 64px rgba(0,0,0,.5),
                0 0 0 1px rgba(255,255,255,0.04) inset;
        }

        /* Logo */
        .logo { text-align: center; margin-bottom: 36px; }
        .logo-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #0B2341 0%, #1F3C56 100%);
            border: 2px solid rgba(200,146,26,0.5);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            margin-bottom: 16px;
            box-shadow: 0 4px 20px rgba(200,146,26,0.2), 0 0 0 4px rgba(200,146,26,0.06);
        }
        .logo-wordmark {
            font-size: 11px;
            font-weight: 700;
            color: #C8921A;
            letter-spacing: 3.5px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .logo h1 {
            font-size: 20px;
            font-weight: 700;
            color: #eef3f8;
            letter-spacing: -.3px;
        }
        .logo p {
            margin-top: 5px;
            font-size: 11px;
            color: rgba(200,146,26,0.6);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Divider */
        .logo-divider {
            width: 40px;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(200,146,26,0.5), transparent);
            margin: 14px auto 0;
        }

        /* Form */
        .field { margin-bottom: 18px; }
        label {
            display: block;
            font-size: 10px;
            font-weight: 700;
            color: rgba(200,146,26,0.75);
            text-transform: uppercase;
            letter-spacing: 1.2px;
            margin-bottom: 7px;
        }
        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px 13px;
            background: rgba(6,16,30,0.6);
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 8px;
            color: #dde6f0;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
        }
        input:focus {
            border-color: rgba(200,146,26,0.7);
            box-shadow: 0 0 0 3px rgba(200,146,26,0.1);
        }

        .error {
            display: none;
            background: rgba(42,14,14,0.8);
            border: 1px solid rgba(107,34,34,0.8);
            border-radius: 7px;
            padding: 10px 13px;
            font-size: 13px;
            color: #f09090;
            margin-bottom: 18px;
            line-height: 1.4;
        }

        .btn {
            width: 100%;
            padding: 11px;
            background: #C8921A;
            border: none;
            border-radius: 8px;
            color: #0B2341;
            font-size: 14px;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: background .15s, transform .1s, box-shadow .15s;
            margin-top: 6px;
            letter-spacing: .3px;
            box-shadow: 0 2px 12px rgba(200,146,26,0.3);
        }
        .btn:hover:not(:disabled) {
            background: #DBA020;
            box-shadow: 0 4px 18px rgba(200,146,26,0.4);
        }
        .btn:active:not(:disabled) { transform: scale(.99); }
        .btn:disabled { opacity: .45; cursor: default; }

        .footer {
            text-align: center;
            margin-top: 28px;
            font-size: 10.5px;
            color: rgba(90,122,150,0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .footer svg { opacity: .5; flex-shrink: 0; }

        /* Panel de cambio obligatorio de credenciales */
        #changePanel { display: none; }
        .change-banner {
            background: rgba(11,35,65,0.5);
            border: 1px solid rgba(200,146,26,0.35);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 13px;
            color: rgba(200,146,26,0.9);
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .pin-input {
            letter-spacing: 6px;
            font-size: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">⚗️</div>
            <div class="logo-wordmark">DRP Assurance</div>
            <h1>SMART Validation</h1>
            <p>Gestión de Evidencias GxP</p>
            <div class="logo-divider"></div>
        </div>

        <div id="errorBox" class="error" role="alert"></div>

        <div class="field">
            <label for="username">Usuario</label>
            <input type="text" id="username" placeholder="usuario"
                   autocomplete="username" autofocus spellcheck="false" autocorrect="off">
        </div>

        <div class="field">
            <label for="password">Contraseña / PIN</label>
            <input type="password" id="password" placeholder="••••••••"
                   autocomplete="current-password">
        </div>

        <button class="btn" id="loginBtn" onclick="doLogin()">Iniciar sesión</button>

        <!-- ── Panel de cambio obligatorio (aparece tras primer login) ── -->
        <div id="changePanel">
            <div class="change-banner">
                🔐 Por seguridad, debés establecer tus credenciales personales antes de continuar.
            </div>
            <div id="changePwdFields">
                <div class="field">
                    <label for="newPassword">Nueva contraseña</label>
                    <input type="password" id="newPassword" placeholder="Mínimo 8 caracteres"
                           autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="newPassword2">Confirmar contraseña</label>
                    <input type="password" id="newPassword2" placeholder="Repetí la contraseña"
                           autocomplete="new-password">
                </div>
            </div>
            <div id="changePinFields" style="display:none">
                <div class="field">
                    <label for="newPin">Nuevo PIN</label>
                    <input type="password" id="newPin" placeholder="••••••" maxlength="8"
                           inputmode="numeric" pattern="[0-9]*" class="pin-input"
                           autocomplete="new-password">
                </div>
                <div class="field">
                    <label for="newPin2">Confirmar PIN</label>
                    <input type="password" id="newPin2" placeholder="••••••" maxlength="8"
                           inputmode="numeric" pattern="[0-9]*" class="pin-input"
                           autocomplete="new-password">
                </div>
            </div>
            <button class="btn" id="changeBtn" onclick="doChangeCredentials()">Guardar y continuar</button>
        </div>

        <div class="footer">
            <svg width="12" height="14" viewBox="0 0 12 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="1" y="6" width="10" height="8" rx="1.5" fill="#5a7a96"/>
                <path d="M3 6V4a3 3 0 016 0v2" stroke="#5a7a96" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            Administradores: contraseña · Clientes: PIN numérico
        </div>
    </div>

    <script>
        let _pendingRole = null;
        const _mobileToken = new URLSearchParams(window.location.search).get('mobile') || '';
        const _nextUrl = _mobileToken ? `/?mobile=${encodeURIComponent(_mobileToken)}` : (new URLSearchParams(window.location.search).get('next') || '/');

        document.addEventListener('keydown', function(e) {
            if (e.key !== 'Enter') return;
            if (document.getElementById('changePanel').style.display !== 'none') {
                doChangeCredentials();
            } else {
                doLogin();
            }
        });

        async function doLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorBox = document.getElementById('errorBox');
            const btn      = document.getElementById('loginBtn');

            errorBox.style.display = 'none';

            if (!username || !password) {
                return showError('Completá usuario y contraseña.');
            }

            btn.disabled    = true;
            btn.textContent = 'Verificando...';

            try {
                const res = await fetch('/auth/login', {
                    method:      'POST',
                    headers:     { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body:        JSON.stringify({ username, password }),
                });
                const data = await res.json();
                if (data.ok) {
                    if (data.must_change) {
                        _pendingRole = data.role;
                        ['username','password'].forEach(id => {
                            const el = document.getElementById(id);
                            if (el) el.closest('.field').style.display = 'none';
                        });
                        document.getElementById('loginBtn').style.display = 'none';
                        document.querySelector('.footer').style.display   = 'none';
                        document.getElementById('changePanel').style.display = 'block';
                        if (data.role === 'client') {
                            document.getElementById('changePwdFields').style.display = 'none';
                            document.getElementById('changePinFields').style.display = 'block';
                        }
                    } else {
                        window.location.replace(data.role === 'client' ? '/firmas/' : _nextUrl);
                    }
                } else {
                    showError(data.error || 'Credenciales incorrectas. Intentá de nuevo.');
                    btn.disabled    = false;
                    btn.textContent = 'Iniciar sesión';
                }
            } catch (e) {
                showError('Error de conexión. Verificá tu acceso a internet.');
                btn.disabled    = false;
                btn.textContent = 'Iniciar sesión';
            }
        }

        async function doChangeCredentials() {
            const errorBox = document.getElementById('errorBox');
            const btn      = document.getElementById('changeBtn');
            errorBox.style.display = 'none';
            btn.disabled    = true;
            btn.textContent = 'Guardando...';

            let body;
            if (_pendingRole === 'client') {
                const pin  = document.getElementById('newPin').value;
                const pin2 = document.getElementById('newPin2').value;
                if (!pin || !/^\d{6,8}$/.test(pin)) {
                    showError('El PIN debe tener entre 6 y 8 dígitos numéricos.');
                    btn.disabled = false; btn.textContent = 'Guardar y continuar'; return;
                }
                if (pin !== pin2) {
                    showError('Los PINs no coinciden.');
                    btn.disabled = false; btn.textContent = 'Guardar y continuar'; return;
                }
                body = { new_pin: pin };
            } else {
                const pw  = document.getElementById('newPassword').value;
                const pw2 = document.getElementById('newPassword2').value;
                if (!pw || pw.length < 8) {
                    showError('La contraseña debe tener al menos 8 caracteres.');
                    btn.disabled = false; btn.textContent = 'Guardar y continuar'; return;
                }
                if (pw !== pw2) {
                    showError('Las contraseñas no coinciden.');
                    btn.disabled = false; btn.textContent = 'Guardar y continuar'; return;
                }
                body = { new_password: pw };
            }

            try {
                const res = await fetch('/auth/change-credentials', {
                    method:  'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(body),
                });
                const data = await res.json();
                if (data.ok) {
                    window.location.replace(_pendingRole === 'client' ? '/firmas/' : _nextUrl);
                } else {
                    showError(data.error || 'Error al guardar. Intentá de nuevo.');
                    btn.disabled = false; btn.textContent = 'Guardar y continuar';
                }
            } catch (e) {
                showError('Error de conexión.');
                btn.disabled = false; btn.textContent = 'Guardar y continuar';
            }
        }

        function showError(msg) {
            const el = document.getElementById('errorBox');
            el.textContent    = msg;
            el.style.display  = 'block';
        }
    </script>
</body>
</html>
