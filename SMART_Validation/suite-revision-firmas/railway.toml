[build]
builder = "DOCKERFILE"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

# ── Variables de entorno requeridas en Railway (servicio "suite-revision-firmas") ──
# ENV=production
# DATABASE_URL=<misma instancia Postgres del proyecto — tablas rf_* aisladas>
# RF_AUTH_SECRET_KEY=<secreto propio, generar con secrets.token_hex(32)>
# RF_APP_BASE_URL=https://<dominio-de-este-servicio>.up.railway.app
# RF_SUPERADMIN_USERNAME=<usuario DRP owner>
# RF_SUPERADMIN_PASSWORD=<password inicial, cambiar tras primer login>
# RF_SUPERADMIN_EMAIL=<email del owner>
# RF_SUPERADMIN_DISPLAY=<Nombre Completo>
# RESEND_API_KEY=<misma cuenta Resend o una dedicada>
# RF_FROM_EMAIL=<remitente de invitaciones/notificaciones>
