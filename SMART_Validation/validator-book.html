<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Libro del Validador — SMART Validation</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#EEF2F7;color:#2D3748;display:flex;flex-direction:column;height:100vh;overflow:hidden}

    /* ── Top bar ─────────────────────────────────────────────────────── */
    #topbar{background:#1F3C56;color:#fff;height:52px;display:flex;align-items:center;padding:0 12px;gap:10px;flex-shrink:0;box-shadow:0 2px 8px rgba(0,0,0,.35);z-index:10}
    #sidebar-toggle{background:none;border:none;color:#fff;cursor:pointer;padding:6px;display:flex;align-items:center;opacity:.65;transition:opacity .15s;flex-shrink:0}
    #sidebar-toggle:hover{opacity:1}
    .tb-logo{font-size:12px;font-weight:700;letter-spacing:.5px;color:#7FA3C0;white-space:nowrap}
    .tb-sep{color:#3D5870;font-size:16px}
    #tb-title{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
    #tb-counter{font-size:12px;color:#8BAEC8;white-space:nowrap;flex-shrink:0}
    .nav-btn{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18);color:#fff;padding:5px 13px;border-radius:4px;cursor:pointer;font-size:12px;transition:background .15s;white-space:nowrap;flex-shrink:0}
    .nav-btn:hover{background:rgba(255,255,255,.22)}
    .nav-btn:disabled{opacity:.3;cursor:default}

    /* ── Progress bar ────────────────────────────────────────────────── */
    #prog-wrap{height:3px;background:rgba(0,0,0,.12);flex-shrink:0}
    #prog-fill{height:100%;background:#27AE60;transition:width .3s ease;width:0}

    /* ── Main layout ─────────────────────────────────────────────────── */
    #main{display:flex;flex:1;overflow:hidden}

    /* ── Sidebar ─────────────────────────────────────────────────────── */
    #sidebar{width:230px;background:#182838;color:#fff;display:flex;flex-direction:column;flex-shrink:0;transition:width .22s ease,opacity .22s ease;overflow:hidden}
    #sidebar.closed{width:0;opacity:0}
    #sb-hdr{padding:11px 14px;font-size:10px;font-weight:700;letter-spacing:1.1px;color:#4F7490;text-transform:uppercase;border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
    #tc-list{overflow-y:auto;flex:1}
    .tc-item{padding:9px 12px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);display:flex;align-items:center;gap:8px;transition:background .1s}
    .tc-item:hover{background:rgba(255,255,255,.07)}
    .tc-item.active{background:rgba(39,174,96,.18);border-left:3px solid #27AE60}
    .tc-item .lvl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
    .tc-item-info{min-width:0}
    .tc-item-id{font-size:11px;font-weight:700;font-family:monospace;color:#8BAEC8;white-space:nowrap}
    .tc-item-name{font-size:11px;color:#9FB8CE;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    /* ── Content area ────────────────────────────────────────────────── */
    #content{flex:1;overflow-y:auto;padding:24px 28px}
    .tc-wrap{max-width:940px;margin:0 auto}

    /* ── Guide card ──────────────────────────────────────────────────── */
    .g-card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.09);overflow:hidden;margin-bottom:16px}
    .g-hdr{background:#1F3C56;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .g-hdr-left{display:flex;align-items:center;gap:10px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap}
    .g-hdr-right{font-size:11px;color:#6B96B5;white-space:nowrap}

    .badge{display:inline-block;padding:2px 8px;border-radius:3px;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
    .b-critico{background:#C0392B;color:#fff}
    .b-alto   {background:#E67E22;color:#fff}
    .b-medio  {background:#3498DB;color:#fff}
    .b-bajo   {background:#27AE60;color:#fff}
    .b-positivo{background:#27AE60;color:#fff}
    .b-negativo{background:#C0392B;color:#fff}
    .b-borde  {background:#718096;color:#fff}
    .b-default{background:#718096;color:#fff}

    .g-body{padding:20px 20px 0}
    .sec-title{font-size:13px;font-weight:700;color:#1F3C56;margin-bottom:8px}
    .sec-text{font-size:13px;line-height:1.65;color:#4A5568;margin-bottom:18px}
    .prec-list{margin-bottom:18px;list-style:none}
    .prec-list li{font-size:13px;color:#4A5568;line-height:1.55;padding:4px 0 4px 18px;position:relative}
    .prec-list li::before{content:'•';position:absolute;left:5px;color:#1F3C56;font-weight:700}

    /* Steps table */
    .steps-tbl{width:100%;border-collapse:collapse;margin-bottom:18px;font-size:13px}
    .steps-tbl th{background:#F5F8FA;border-bottom:2px solid #E2E8F0;padding:9px 12px;text-align:left;font-weight:700;color:#2D3748;font-size:12px}
    .steps-tbl td{padding:10px 12px;border-bottom:1px solid #F0F4F8;vertical-align:top;line-height:1.55;color:#4A5568}
    .steps-tbl tr:nth-child(even) td{background:#FAFBFD}
    .step-num{width:44px;text-align:center;font-weight:700;color:#718096;font-size:12px}
    .step-res{font-style:italic;color:#5A6575}

    /* Acceptance criteria */
    .crit-box{background:#FFFBEB;border:1px solid #F6C90E;border-left:4px solid #E6A817;border-radius:4px;padding:14px 16px;margin:0 20px 20px}
    .crit-title{font-size:12px;font-weight:700;color:#92400E;margin-bottom:6px}
    .crit-text{font-size:13px;color:#78350F;line-height:1.65}

    /* Guide footer */
    .g-foot{border-top:1px solid #EEF2F7;padding:10px 20px;font-size:11px;color:#718096;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
    .g-foot .mitem{display:flex;align-items:center;gap:5px}
    .g-foot .mlbl{font-weight:700;color:#4A5568}
    .mtag{background:#EBF4FF;color:#2B6CB0;padding:1px 6px;border-radius:3px;font-size:10px;font-weight:600}
    .mtag-ra{background:#FEEBC8;color:#744210}
    .mtag-rpn{background:#F0FFF4;color:#22543D}

    /* ── Traceability card ───────────────────────────────────────────── */
    .t-card{background:#fff;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.09);overflow:hidden}
    .t-hdr{background:#2D3748;padding:10px 16px;display:flex;align-items:center;justify-content:space-between}
    .t-hdr-title{font-size:12px;font-weight:700;color:#fff;letter-spacing:.5px}
    .t-hdr-code{font-size:11px;color:#8BAEC8}
    .t-body{padding:16px}
    .t-sec-title{font-size:10px;font-weight:700;color:#718096;text-transform:uppercase;letter-spacing:.8px;margin-bottom:10px}
    .req-card{border-radius:4px;border-left:4px solid #3498DB;padding:10px 12px;margin-bottom:8px;background:#F7FAFC;display:flex;flex-direction:column;gap:3px}
    .req-card.ra{border-left-color:#E67E22}
    .req-row{display:flex;align-items:center;gap:8px}
    .req-badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:3px;color:#fff;background:#3498DB;flex-shrink:0}
    .req-badge.ra{background:#E67E22}
    .req-id{font-size:13px;font-weight:700;color:#2D3748}
    .req-nivel{font-size:10px;font-weight:700;color:#C0392B}
    .req-desc{font-size:12px;color:#4A5568;line-height:1.5}
    .req-origin{font-size:11px;color:#A0AEC0}
    .no-traza{font-size:12px;color:#A0AEC0;font-style:italic;padding:4px 0}

    /* ── Loading / empty states ──────────────────────────────────────── */
    .center-msg{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;gap:12px;color:#A0AEC0;font-size:14px}
    .center-msg h2{font-size:18px;color:#4A5568;font-weight:600}
    .center-msg p{font-size:13px;text-align:center;max-width:380px;line-height:1.6}
    .spinner{width:32px;height:32px;border:3px solid #E2E8F0;border-top-color:#1F3C56;border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}

    /* ── Keyboard hint ───────────────────────────────────────────────── */
    #kbd-hint{text-align:center;font-size:11px;color:#A0AEC0;padding:10px 0 2px}
    .kbd{display:inline-block;background:#EDF2F7;border:1px solid #CBD5E0;border-radius:3px;padding:1px 6px;font-family:monospace;font-size:11px;color:#4A5568}

    /* ── Scrollbar ───────────────────────────────────────────────────── */
    #content::-webkit-scrollbar,#tc-list::-webkit-scrollbar{width:6px}
    #content::-webkit-scrollbar-track,#tc-list::-webkit-scrollbar-track{background:transparent}
    #content::-webkit-scrollbar-thumb,#tc-list::-webkit-scrollbar-thumb{background:#CBD5E0;border-radius:3px}

    /* ── PDF button ──────────────────────────────────────────────────── */
    #btn-pdf{background:rgba(39,174,96,.18);border:1px solid rgba(39,174,96,.45);color:#A8F0C0;padding:5px 13px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;transition:background .15s;white-space:nowrap;flex-shrink:0;display:flex;align-items:center;gap:5px}
    #btn-pdf:hover{background:rgba(39,174,96,.32)}
    #btn-pdf.loading{opacity:.55;cursor:wait}

    /* ── Print view (screen: hidden) ─────────────────────────────────── */
    #print-view{display:none}

    /* ── @media print ────────────────────────────────────────────────── */
    @media print{
      @page{margin:18mm 15mm;size:A4}
      html,body{height:auto;overflow:visible;background:#fff}
      #topbar,#prog-wrap,#main,#kbd-hint{display:none!important}
      #print-view{display:block}

      /* Cover page */
      .pv-cover{page-break-after:always;display:flex;flex-direction:column;justify-content:center;min-height:240mm;padding:20mm 10mm;text-align:center;background:#1F3C56;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-cover-logo{font-size:11px;font-weight:700;letter-spacing:1.5px;color:#7FA3C0;text-transform:uppercase;margin-bottom:8mm}
      .pv-cover-title{font-size:28px;font-weight:800;color:#fff;margin-bottom:4mm;line-height:1.2}
      .pv-cover-sub{font-size:16px;color:#A8C8E0;margin-bottom:12mm}
      .pv-cover-meta{font-size:12px;color:#CBD5E0;border-top:1px solid rgba(255,255,255,.25);border-bottom:1px solid rgba(255,255,255,.12);padding:5mm 0;margin:0 auto;width:80%;display:flex;flex-direction:column;gap:3mm}
      .pv-cover-meta span{display:block}
      .pv-cover-meta strong{color:#fff}
      .pv-cover-note{margin-top:8mm;font-size:10px;color:rgba(255,255,255,.4);font-style:italic}

      /* TC pages */
      .pv-tc{page-break-after:always;page-break-inside:avoid}
      .pv-tc:last-child{page-break-after:auto}

      /* TC header band */
      .pv-tc-band{background:#1F3C56;color:#fff;padding:7mm 8mm 5mm;display:flex;justify-content:space-between;align-items:flex-start;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-tc-band-left{}
      .pv-tc-band-id{font-size:10px;font-family:monospace;color:#A0B4C8;margin-bottom:1mm}
      .pv-tc-band-title{font-size:15px;font-weight:700;color:#fff;line-height:1.3}
      .pv-tc-band-right{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
      .pv-tc-badge{padding:2px 7px;border-radius:3px;font-size:9px;font-weight:700;text-transform:uppercase;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-b-critico{background:#C0392B;color:#fff}
      .pv-b-alto{background:#E67E22;color:#fff}
      .pv-b-medio{background:#3498DB;color:#fff}
      .pv-b-bajo{background:#27AE60;color:#fff}
      .pv-b-positivo{background:#27AE60;color:#fff}
      .pv-b-negativo{background:#C0392B;color:#fff}
      .pv-b-default{background:#718096;color:#fff}
      .pv-tc-docref{font-size:9px;color:#7FA3C0;margin-top:2mm}

      /* TC body */
      .pv-tc-body{padding:5mm 8mm 0}
      .pv-section-title{font-size:10px;font-weight:700;color:#1F3C56;text-transform:uppercase;letter-spacing:.5px;margin-bottom:2mm;margin-top:4mm}
      .pv-section-text{font-size:11px;color:#4A5568;line-height:1.6;margin-bottom:3mm}
      .pv-prec-list{margin-bottom:3mm;padding-left:0;list-style:none}
      .pv-prec-list li{font-size:11px;color:#4A5568;line-height:1.55;padding:1mm 0 1mm 5mm;position:relative}
      .pv-prec-list li::before{content:'•';position:absolute;left:1mm;color:#1F3C56;font-weight:700}

      /* Steps table */
      .pv-steps-tbl{width:100%;border-collapse:collapse;margin-bottom:3mm;font-size:10px}
      .pv-steps-tbl th{background:#F5F8FA;border:1px solid #E2E8F0;padding:2mm 3mm;text-align:left;font-weight:700;color:#2D3748;font-size:9.5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-steps-tbl td{border:1px solid #E8EDF2;padding:2mm 3mm;vertical-align:top;line-height:1.5;color:#4A5568}
      .pv-steps-tbl .pv-step-num{width:8mm;text-align:center;font-weight:700;color:#718096}
      .pv-steps-tbl .pv-step-res{font-style:italic;color:#5A6575}

      /* Criterio */
      .pv-crit-box{background:#FFFBEB;border:1px solid #F6C90E;border-left:4px solid #E6A817;border-radius:3px;padding:3mm 4mm;margin:3mm 0 3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-crit-title{font-size:10px;font-weight:700;color:#92400E;margin-bottom:1.5mm}
      .pv-crit-text{font-size:11px;color:#78350F;line-height:1.55}

      /* Footer */
      .pv-tc-foot{border-top:1px solid #E2E8F0;padding:3mm 8mm;font-size:9.5px;color:#718096;display:flex;gap:6mm;flex-wrap:wrap;align-items:center}
      .pv-foot-item{display:flex;align-items:center;gap:2mm}
      .pv-foot-label{font-weight:700;color:#4A5568}
      .pv-foot-tag{background:#EBF4FF;color:#2B6CB0;padding:0 3px;border-radius:2px;font-size:9px;font-weight:600;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-foot-tag-ra{background:#FEEBC8;color:#744210}
      .pv-foot-tag-rpn{background:#F0FFF4;color:#22543D}

      /* Traza */
      .pv-traza-hdr{background:#2D3748;color:#fff;padding:3mm 8mm;font-size:10px;font-weight:700;letter-spacing:.5px;margin-top:3mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-traza-body{padding:3mm 8mm 5mm}
      .pv-req-card{border-left:3px solid #3498DB;padding:2mm 3mm;margin-bottom:2mm;background:#F7FAFC;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-req-card.ra{border-left-color:#E67E22}
      .pv-req-row{display:flex;align-items:center;gap:3mm;margin-bottom:1mm}
      .pv-req-badge{font-size:8.5px;font-weight:700;padding:0 3px;border-radius:2px;color:#fff;background:#3498DB;-webkit-print-color-adjust:exact;print-color-adjust:exact}
      .pv-req-badge.ra{background:#E67E22}
      .pv-req-id{font-size:11px;font-weight:700;color:#2D3748}
      .pv-req-nivel{font-size:9px;font-weight:700;color:#C0392B}
      .pv-req-desc{font-size:10.5px;color:#4A5568;line-height:1.45}
      .pv-req-origin{font-size:9.5px;color:#A0AEC0}

      /* Page number via counter */
      .pv-tc-band::after{content:none}
    }
  </style>
</head>
<body>

<!-- Top bar -->
<div id="topbar">
  <button id="sidebar-toggle" title="Mostrar/ocultar lista">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <span class="tb-logo">SMART Validation</span>
  <span class="tb-sep">|</span>
  <span id="tb-title">Libro del Validador</span>
  <span id="tb-counter"></span>
  <button class="nav-btn" id="btn-prev" disabled>← Anterior</button>
  <button class="nav-btn" id="btn-next" disabled>Siguiente →</button>
  <button id="btn-pdf" onclick="exportPDF()" title="Exportar PDF con todos los Test Cases">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M3 17v2a2 2 0 002 2h14a2 2 0 002-2v-2"/></svg>
    PDF
  </button>
</div>
<div id="prog-wrap"><div id="prog-fill"></div></div>

<!-- Main -->
<div id="main">
  <div id="sidebar">
    <div id="sb-hdr">Test Cases</div>
    <div id="tc-list"></div>
  </div>
  <div id="content">
    <div class="center-msg" id="status-msg">
      <div class="spinner"></div>
      <span>Cargando protocolo…</span>
    </div>
  </div>
</div>

<div id="print-view"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────
const params   = new URLSearchParams(location.search);
const projId   = params.get('project') || '';
const docType  = (params.get('doc') || '').toUpperCase();
const docTypes = docType === 'ALL' ? ['PIQ','POQ','PPQ']
               : docType.includes(',') ? docType.split(',').map(d => d.trim())
               : [docType];
const isMultiDoc = docTypes.length > 1;
let allTcs        = [];   // flat array of all TCs
let sectionMap    = {};   // tcId → parent section title
let tcProtocolMap = {};   // tcId → {type, code, version}  (multi-doc only)
let docMeta       = {};   // document metadata (single-doc or combined header)
let currentIdx = parseInt(params.get('tc') || '0', 10) || 0;
let ursData    = null;    // URS document (loaded in background)
let raData     = null;    // RA document (loaded in background)
let sidebarOpen = true;

// ── Boot ───────────────────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
  document.getElementById('btn-prev').addEventListener('click', () => navigate(-1));
  document.getElementById('btn-next').addEventListener('click', () => navigate(1));
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft')  navigate(-1);
    if (e.key === 'ArrowRight') navigate(1);
  });

  if (!projId || !docType) {
    showError('Parámetros faltantes',
      'Abrí este libro desde la Suite de Validación usando el botón "Libro del Validador" en el protocolo correspondiente.',
      'URL esperada: /validator-book.html?project=proj_xxx&doc=POQ  |  &doc=ALL para los 3');
    return;
  }
  loadDocument();
});

// ── Load protocol document ─────────────────────────────────────────────────
async function loadDocument() {
  if (isMultiDoc) { await loadMultipleDocuments(); return; }
  try {
    const parsed = await fetchDoc(docTypes[0]);
    if (!parsed) {
      showError('Documento no encontrado',
        `No se encontró el documento ${docTypes[0]} en el proyecto. Asegurate de que el protocolo fue importado en la Suite.`);
      return;
    }

    docMeta = {
      code    : parsed.document?.code    || docTypes[0],
      version : parsed.document?.version || '1.0',
      type    : parsed.type || docTypes[0],
      projName: parsed.package?.systemName || projId,
    };

    extractTCs(parsed, null);

    if (allTcs.length === 0) {
      showError('Sin Test Cases',
        `El documento ${docTypes[0]} no tiene TCs definidos. Generá el protocolo con TCs desde Claude Desktop o el AI Generator.`);
      return;
    }

    currentIdx = Math.max(0, Math.min(currentIdx, allTcs.length - 1));
    buildSidebar();
    renderTC(currentIdx);
    loadTraceabilityDocs(projId);
    document.title = `Libro del Validador — ${docMeta.type} ${docMeta.code}`;

  } catch(err) {
    showError('No se pudo cargar el documento', err.message);
  }
}

// ── Fetch a single doc: tries window.opener.packageDocs first, then server API
async function fetchDoc(type) {
  // Primary: read from the opener tab's in-memory packageDocs (same-origin, no API call needed)
  try {
    const pkg = window.opener && window.opener.packageDocs;
    if (Array.isArray(pkg)) {
      const entry = pkg.find(d => d && d.type && d.type.toUpperCase() === type.toUpperCase());
      if (entry && entry.data) return entry.data;
    }
  } catch(e) { /* cross-origin guard (won't happen on same host but just in case) */ }

  // Fallback: server API (for cases where the tab was opened directly or refreshed)
  try {
    const resp = await fetch(`/api/projects/${projId}/documents/${type}`, { credentials: 'include' });
    if (resp.status === 401) { location.href = '/login.html'; return null; }
    if (!resp.ok) return null;
    const data = await resp.json();
    if (!data.ok) return null;
    const doc = data.document;
    return typeof doc.content === 'object' ? doc.content : JSON.parse(doc.json_data || doc.content);
  } catch { return null; }
}

// ── Extract TCs from a parsed document into allTcs/sectionMap
// Deduplicates by tcId: if the same TC appears in multiple sections, keeps the richer one.
function extractTCs(parsed, protoMeta) {
  const secciones = Array.isArray(parsed.secciones) ? parsed.secciones : [];
  secciones.forEach(sec => {
    if (sec.tipo === 'tabla-test-case' || sec.tipo === 'matriz-tc') {
      const label = sec.titulo || 'Test Cases';
      (Array.isArray(sec.tcs) ? sec.tcs : []).forEach(tc => {
        if (tc.tcId) {
          const existingIdx = allTcs.findIndex(t => t.tcId === tc.tcId);
          if (existingIdx >= 0) {
            // Prefer the richer entry (has objetivo/procedimiento/criterios)
            const ex = allTcs[existingIdx];
            const exScore = (ex.objetivo ? 10 : 0) + (ex.procedimiento?.length || 0) * 2 +
                            (ex.criterioAceptacion ? 5 : 0) + (ex.criterios?.length || 0) * 3 +
                            (ex.evidenciaEsperada ? 4 : 0);
            const newScore = (tc.objetivo ? 10 : 0) + (tc.procedimiento?.length || 0) * 2 +
                             (tc.criterioAceptacion ? 5 : 0) + (tc.criterios?.length || 0) * 3 +
                             (tc.evidenciaEsperada ? 4 : 0);
            if (newScore > exScore) {
              allTcs[existingIdx] = tc;
              sectionMap[tc.tcId] = label;
              if (protoMeta) tcProtocolMap[tc.tcId] = protoMeta;
            }
            return;
          }
        }
        allTcs.push(tc);
        if (tc.tcId) {
          sectionMap[tc.tcId] = label;
          if (protoMeta) tcProtocolMap[tc.tcId] = protoMeta;
        }
      });
    }
  });
}

// ── Multi-doc loader ───────────────────────────────────────────────────────
async function loadMultipleDocuments() {
  const results = await Promise.all(docTypes.map(t => fetchDoc(t)));
  const first   = results.find(r => r !== null);

  if (!first) {
    showError('Sin protocolos', 'No se encontró ningún protocolo (PIQ, POQ, PPQ) en este proyecto. Asegurate de que los protocolos están importados en la Suite.');
    return;
  }

  docMeta = {
    code    : 'IQ + OQ + PQ',
    version : '',
    type    : 'COMPLETO',
    projName: first.package?.systemName || projId,
  };

  allTcs = [];
  results.forEach((parsed, i) => {
    if (!parsed) return;
    const type    = docTypes[i];
    const code    = parsed.document?.code    || type;
    const version = parsed.document?.version || '1.0';
    extractTCs(parsed, { type, code, version });
  });

  if (allTcs.length === 0) {
    showError('Sin Test Cases', 'Ninguno de los tres protocolos tiene TCs definidos.');
    return;
  }

  currentIdx = Math.max(0, Math.min(currentIdx, allTcs.length - 1));
  buildSidebar();
  renderTC(currentIdx);
  loadTraceabilityDocs(projId);
  document.title = `Libro Completo IQ + OQ + PQ — ${docMeta.projName}`;
}

// ── Background traceability ────────────────────────────────────────────────
async function loadTraceabilityDocs(pid) {
  [ursData, raData] = await Promise.all([fetchDoc('URS'), fetchDoc('RA')]);
  // Re-render traceability panel if current TC has refs
  const tc = allTcs[currentIdx];
  if (tc && ((tc.ursVinculados||[]).length || tc.raVinculado)) {
    const tCard = document.querySelector('.t-card');
    if (tCard) tCard.replaceWith(buildTrazeCard(tc, getTcMeta(tc)));
  }
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function buildSidebar() {
  const list = document.getElementById('tc-list');
  list.innerHTML = '';
  let lastProto = null;
  allTcs.forEach((tc, i) => {
    if (isMultiDoc && tc.tcId) {
      const proto = (tcProtocolMap[tc.tcId] || {}).type;
      if (proto && proto !== lastProto) {
        lastProto = proto;
        const hdr = document.createElement('div');
        hdr.style.cssText = 'padding:5px 12px;font-size:9.5px;font-weight:700;letter-spacing:1.1px;color:#4F7490;text-transform:uppercase;background:rgba(0,0,0,.18);border-top:1px solid rgba(255,255,255,.06);border-bottom:1px solid rgba(255,255,255,.04)';
        hdr.textContent = proto;
        list.appendChild(hdr);
      }
    }
    const item = document.createElement('div');
    item.className = 'tc-item' + (i === currentIdx ? ' active' : '');
    item.dataset.idx = i;
    const dot = document.createElement('div');
    dot.className = 'lvl-dot';
    dot.style.background = levelColor(tc.nivel || tc.profundidad);
    const info = document.createElement('div');
    info.className = 'tc-item-info';
    info.innerHTML = `<div class="tc-item-id">${tc.tcId || `TC-${i+1}`}</div><div class="tc-item-name">${tc.titulo || ''}</div>`;
    item.appendChild(dot);
    item.appendChild(info);
    item.addEventListener('click', () => navigate(i - currentIdx));
    list.appendChild(item);
  });
}

// ── Per-TC metadata (multi-doc: returns the protocol the TC belongs to) ────
function getTcMeta(tc) {
  if (!isMultiDoc || !tc.tcId) return docMeta;
  const proto = tcProtocolMap[tc.tcId];
  return proto ? proto : docMeta;
}

function updateSidebarActive() {
  document.querySelectorAll('.tc-item').forEach((el, i) => {
    el.classList.toggle('active', i === currentIdx);
  });
  // Scroll the active item into view
  const active = document.querySelector('.tc-item.active');
  if (active) active.scrollIntoView({ block: 'nearest' });
}

// ── Navigation ─────────────────────────────────────────────────────────────
function navigate(delta) {
  const next = currentIdx + delta;
  if (next < 0 || next >= allTcs.length) return;
  currentIdx = next;
  renderTC(currentIdx);
  updateSidebarActive();
  // Update URL without reload
  const u = new URL(location.href);
  u.searchParams.set('tc', currentIdx);
  history.replaceState(null, '', u.toString());
  document.getElementById('content').scrollTop = 0;
}

function toggleSidebar() {
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('closed', !sidebarOpen);
}

// ── Render TC ──────────────────────────────────────────────────────────────
function renderTC(idx) {
  const tc = allTcs[idx];
  const total = allTcs.length;

  // Progress
  document.getElementById('prog-fill').style.width = `${((idx + 1) / total) * 100}%`;

  // Counter + nav state
  document.getElementById('tb-counter').textContent = `TC ${idx + 1} / ${total}`;
  const tcMeta = getTcMeta(tc);
  document.getElementById('tb-title').textContent = isMultiDoc
    ? `${tcMeta.type} — ${tcMeta.code} v${tcMeta.version}`
    : `${docMeta.type} — ${docMeta.code} v${docMeta.version}`;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === total - 1;

  const content = document.getElementById('content');
  content.innerHTML = '';

  const wrap = document.createElement('div');
  wrap.className = 'tc-wrap';

  wrap.appendChild(buildGuideCard(tc, tcMeta));

  const hasTraza = (tc.ursVinculados || []).length > 0 || tc.raVinculado;
  if (hasTraza) wrap.appendChild(buildTrazeCard(tc, tcMeta));

  // Keyboard hint
  const hint = document.createElement('div');
  hint.id = 'kbd-hint';
  hint.innerHTML = `Navegar: <kbd class="kbd">←</kbd> <kbd class="kbd">→</kbd> &nbsp;·&nbsp; <kbd class="kbd">Alt+L</kbd> lista`;
  wrap.appendChild(hint);

  content.appendChild(wrap);
}

      <rect x="5" y="2" width="14" height="20" rx="2"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/><line x1="9" y1="15" x2="12" y2="15"/>
    </svg>
    GUÍA DEL PROTOCOLO <span style="color:#8BAEC8;font-weight:400">(read-only)</span>`;

    const b = span('badge ' + tipoBadgeClass(tc.tipoTC));
    b.textContent = tc.tipoTC;
    left.appendChild(b);
  }
  hdr.appendChild(left);
  const right = div('g-hdr-right');
  right.textContent = `${meta.type} ${meta.code} v${meta.version}`;
  hdr.appendChild(right);
  card.appendChild(hdr);

  // Resolve field aliases: PIQ uses profundidad/criterios/raScore/grupo; OQ/PQ use nivel/criterioAceptacion/rpn/grupoFuncional
  const tcNivel    = tc.nivel    || tc.profundidad || '';
  const tcGrupo    = tc.grupoFuncional || tc.grupo || '';
  const tcRpn      = tc.rpn      != null ? tc.rpn : (tc.raScore != null ? tc.raScore : null);
  const tcCriterio = tc.criterioAceptacion ||
    (Array.isArray(tc.criterios) && tc.criterios.length ? tc.criterios.join('\n') : '');

  // TC title bar
  const titleBar = div('');
  titleBar.style.cssText = 'background:#F7FAFC;border-bottom:2px solid #E2E8F0;padding:12px 20px;display:flex;align-items:center;gap:12px';
  const tcIdEl = span('');
  tcIdEl.style.cssText = 'font-size:14px;font-weight:800;font-family:monospace;color:#1F3C56;flex-shrink:0';
  tcIdEl.textContent = tc.tcId || '—';
  const tcTitle = span('');
  tcTitle.style.cssText = 'font-size:14px;font-weight:600;color:#2D3748;line-height:1.3';
  tcTitle.textContent = tc.titulo || '';
  const lvlBadge = span('badge ' + levelBadgeClass(tcNivel));
  lvlBadge.textContent = tcNivel;
  titleBar.appendChild(tcIdEl);
  titleBar.appendChild(tcTitle);
  if (tcNivel) titleBar.appendChild(lvlBadge);
  card.appendChild(titleBar);

  // Body
  const body = div('g-body');

  // Objetivo
  if (tc.objetivo) {
    const t = div(''); t.appendChild(p('sec-title', 'Objetivo'));
    t.appendChild(p('sec-text', tc.objetivo));
    body.appendChild(t);
  }

  // Precondiciones
  const precs = Array.isArray(tc.precondiciones) ? tc.precondiciones : [];
  if (precs.length) {
    body.appendChild(p('sec-title', 'Precondiciones'));
    const ul = document.createElement('ul');
    ul.className = 'prec-list';
    precs.forEach(pr => {
      const li = document.createElement('li');
      li.textContent = typeof pr === 'string' ? pr : (pr.texto || JSON.stringify(pr));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  // Procedimiento
  const pasos = Array.isArray(tc.procedimiento) ? tc.procedimiento : [];
  if (pasos.length) {
    body.appendChild(p('sec-title', 'Procedimiento'));
    const tbl = document.createElement('table');
    tbl.className = 'steps-tbl';
    tbl.innerHTML = '<thead><tr><th style="width:46px">Paso</th><th>Instrucción</th><th style="width:38%">Resultado esperado</th></tr></thead>';
    const tbody = document.createElement('tbody');
    pasos.forEach((paso, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="step-num">${paso.paso || (i + 1)}</td>
        <td>${escHtml(paso.instruccion || '')}</td>
        <td class="step-res">${escHtml(paso.resultadoEsperado || '')}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    body.appendChild(tbl);
  }

  card.appendChild(body);

  // Criterio de aceptación (criterioAceptacion OQ/PQ | criterios[] IQ)
  if (tcCriterio) {
    const box = div('crit-box');
    const label = Array.isArray(tc.criterios) && !tc.criterioAceptacion ? 'Criterios de aceptación' : 'Criterio de aceptación';
    if (Array.isArray(tc.criterios) && !tc.criterioAceptacion) {
      const ul = document.createElement('ul');
      ul.style.cssText = 'padding-left:18px;margin:0';
      tc.criterios.forEach(c => {
        const li = document.createElement('li');
        li.style.cssText = 'font-size:13px;color:#78350F;line-height:1.65';
        li.textContent = c;
        ul.appendChild(li);
      });
      box.innerHTML = `<div class="crit-title">${label}</div>`;
      box.appendChild(ul);
    } else {
      box.innerHTML = `<div class="crit-title">${label}</div><p class="crit-text">${escHtml(tcCriterio)}</p>`;
    }
    card.appendChild(box);
  }

  // Evidencia esperada
  if (tc.evidenciaEsperada) {
    const evBox = div('crit-box');
    evBox.style.cssText = 'background:#EBF5FB;border-color:#3498DB;border-left-color:#2980B9;margin:0 20px 20px';
    evBox.innerHTML = `<div class="crit-title" style="color:#1A5276">Evidencia esperada</div><p class="crit-text" style="color:#1A5276">${escHtml(tc.evidenciaEsperada)}</p>`;
    card.appendChild(evBox);
  }

  // Footer
  const foot = div('g-foot');
  if (tcNivel) {
    const mi = div('mitem');
    mi.innerHTML = `<span class="mlbl">Nivel:</span> <span class="badge ${levelBadgeClass(tcNivel)}" style="font-size:10px">${escHtml(tcNivel)}</span>`;
    foot.appendChild(mi);
  }
  if (tcGrupo) {
    const mi = div('mitem');
    mi.innerHTML = `<span class="mlbl">Grupo func.:</span> ${escHtml(tcGrupo)}`;
    foot.appendChild(mi);
  }
  if (tc.raVinculado) {
    const mi = div('mitem');
    mi.innerHTML = `<span class="mlbl">RA:</span> <span class="mtag mtag-ra">${escHtml(tc.raVinculado)}</span>`;
    foot.appendChild(mi);
  }
  const ursArr = Array.isArray(tc.ursVinculados) ? tc.ursVinculados : [];
  if (ursArr.length) {
    const mi = div('mitem');
    mi.innerHTML = `<span class="mlbl">URS:</span> ${ursArr.map(u => `<span class="mtag">${escHtml(String(u))}</span>`).join(' ')}`;
    foot.appendChild(mi);
  }
  if (tcRpn != null) {
    const mi = div('mitem');
    const rpnLabel = tc.raScore != null && tc.rpn == null ? 'RA Score' : 'RPN';
    mi.innerHTML = `<span class="mlbl">${rpnLabel}:</span> <span class="mtag mtag-rpn">${tcRpn}</span>`;
    foot.appendChild(mi);
  }
  if (foot.children.length) card.appendChild(foot);

  return card;
}

// ── Build Traceability Card ────────────────────────────────────────────────
function buildTrazeCard(tc, meta) {
  meta = meta || docMeta;
  const card = div('t-card');

  const hdr = div('t-hdr');
  hdr.innerHTML = `<span class="t-hdr-title">TRAZABILIDAD CRUZADA</span><span class="t-hdr-code">${meta.type} ${meta.code} v${meta.version}</span>`;
  card.appendChild(hdr);

  const body = div('t-body');

  const ursArr = Array.isArray(tc.ursVinculados) ? tc.ursVinculados : [];
  const raVal  = tc.raVinculado || '';

  if (ursArr.length || raVal) {
    body.appendChild(p('t-sec-title', 'UPSTREAM — Origen del requisito'));

    ursArr.forEach(ursId => {
      const ursInfo = findUrsReq(String(ursId));
      const rc = div('req-card');
      const row = div('req-row');
      row.innerHTML = `<span class="req-badge">URS</span><span class="req-id">${escHtml(String(ursId))}</span>`;
      if (ursInfo && ursInfo.criticidad) {
        const nlbl = span('req-nivel');
        nlbl.textContent = ursInfo.criticidad;
        row.appendChild(nlbl);
      }
      rc.appendChild(row);
      if (ursInfo && ursInfo.descripcion) {
        const desc = p('req-desc', ursInfo.descripcion);
        rc.appendChild(desc);
      }
      const origin = p('req-origin', 'Origen: ' + (ursInfo ? (ursInfo.docCode || 'URS') : 'URS'));
      rc.appendChild(origin);
      body.appendChild(rc);
    });

    if (raVal) {
      const raInfo = findRaRisk(raVal);
      const rc = div('req-card ra');
      const row = div('req-row');
      row.innerHTML = `<span class="req-badge ra">RA</span><span class="req-id">${escHtml(raVal)}</span>`;
      rc.appendChild(row);
      if (raInfo && raInfo.descripcion) rc.appendChild(p('req-desc', raInfo.descripcion));
      rc.appendChild(p('req-origin', 'Origen: ' + (raInfo ? (raInfo.docCode || 'RA') : 'RA')));
      body.appendChild(rc);
    }
  }

  if (!body.children.length) {
    body.appendChild(p('no-traza', 'Sin referencias de trazabilidad definidas en este TC.'));
  }

  card.appendChild(body);
  return card;
}

// ── Traceability helpers ───────────────────────────────────────────────────
// URS structure: tipo="tabla" with columnas[0]="URS-ID", filas as arrays
// fila[0]=id-cell, fila[2]=description, fila[4]=criticidad
// Cells can be plain strings or objects {text, bold, color, ...}
function findUrsReq(ursId) {
  if (!ursData) return null;
  const target = String(ursId).trim();
  const secs = ursData.secciones || [];
  for (const sec of secs) {
    if (sec.tipo !== 'tabla') continue;
    if (!Array.isArray(sec.columnas)) continue;
    const col0 = String(sec.columnas[0] || '');
    if (!col0.includes('URS-ID') && !col0.includes('URS_ID') && !col0.includes('urs-id')) continue;
    if (!Array.isArray(sec.filas)) continue;
    for (const fila of sec.filas) {
      if (!Array.isArray(fila)) continue; // skip subheader objects
      if (fila.length < 3) continue;
      const idCell = fila[0];
      const id = (typeof idCell === 'object' ? (idCell.text || '') : String(idCell || '')).trim();
      if (id !== target) continue;
      const descCell = fila[2];
      const descripcion = typeof descCell === 'object' ? (descCell.text || '') : String(descCell || '');
      const critCell = fila.length > 4 ? fila[4] : null;
      const criticidad = critCell ? (typeof critCell === 'object' ? (critCell.text || '') : String(critCell)) : '';
      return {
        descripcion: descripcion.trim(),
        criticidad : criticidad.trim(),
        docCode    : ursData.document?.code || 'URS',
      };
    }
  }
  return null;
}

// RA structure: tipo="tabla-fmea" with filas as objects {id, peligro, urs, S, P, D, control, RR}
function findRaRisk(raId) {
  if (!raData) return null;
  const target = String(raId).trim();
  const secs = raData.secciones || [];
  for (const sec of secs) {
    const filas = sec.filas || sec.riesgos || sec.items || [];
    for (const fila of filas) {
      if (!fila || typeof fila !== 'object' || Array.isArray(fila)) continue;
      if (fila.subheader) continue;
      const id = String(fila.id || fila.raId || fila.codigo || '').trim();
      if (id !== target) continue;
      return {
        descripcion: fila.peligro || fila.descripcion || fila.riesgo || fila.titulo || '',
        docCode    : raData.document?.code || 'RA',
      };
    }
  }
  return null;
}

// ── DOM helpers ────────────────────────────────────────────────────────────
function div(cls)  { const e = document.createElement('div');  if (cls) e.className = cls; return e; }
function span(cls) { const e = document.createElement('span'); if (cls) e.className = cls; return e; }
function p(cls, txt) { const e = document.createElement('p'); if (cls) e.className = cls; if (txt) e.textContent = txt; return e; }
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Badge helpers ──────────────────────────────────────────────────────────
function levelBadgeClass(nivel) {
  const n = (nivel || '').toUpperCase();
  if (n.includes('CRÍT') || n.includes('CRIT')) return 'b-critico';
  if (n === 'ALTO')  return 'b-alto';
  if (n === 'MEDIO') return 'b-medio';
  if (n === 'BAJO')  return 'b-bajo';
  return 'b-default';
}
function levelColor(nivel) {
  const n = (nivel || '').toUpperCase();
  if (n.includes('CRÍT') || n.includes('CRIT')) return '#C0392B';
  if (n === 'ALTO')  return '#E67E22';
  if (n === 'MEDIO') return '#3498DB';
  if (n === 'BAJO')  return '#27AE60';
  return '#718096';
}
function tipoBadgeClass(tipo) {
  const t = (tipo || '').toUpperCase();
  if (t === 'POSITIVO') return 'b-positivo';
  if (t === 'NEGATIVO') return 'b-negativo';
  if (t === 'BORDE')    return 'b-borde';
  return 'b-default';
}

          <div class="pv-cover-logo">SMART Validation &middot; Libro del Validador</div>
          <div class="pv-cover-title">${escHtml(PROTO_LABELS[proto] || proto)}</div>
          <div class="pv-cover-sub">${escHtml((tcProtocolMap[tc.tcId] || {}).code || proto)} v${escHtml((tcProtocolMap[tc.tcId] || {}).version || '1.0')}</div>
          <div class="pv-cover-note">${allTcs.filter(t => t.tcId && (tcProtocolMap[t.tcId]||{}).type === proto).length} Test Cases</div>`;
        pv.appendChild(sep);
      }
    }
    const page = div('pv-tc');
    page.appendChild(buildPrintGuideCard(tc, i));
    const traza = buildPrintTrazeCard(tc);
    if (traza) page.appendChild(traza);
    pv.appendChild(page);
  });
}

function buildPrintGuideCard(tc, idx) {
  const wrap = div('');
  const meta = getTcMeta(tc);

  // Header band
  const band = div('pv-tc-band');
  const bL = div('pv-tc-band-left');
  bL.innerHTML = `
    <div class="pv-tc-band-id">${escHtml(tc.tcId || ('TC-' + (idx + 1)))}</div>
    <div class="pv-tc-band-title">${escHtml(tc.titulo || '')}</div>
    <div class="pv-tc-docref">${escHtml(meta.type)} ${escHtml(meta.code)} v${escHtml(meta.version)}</div>`;
  const bR = div('pv-tc-band-right');
  if (tc.nivel) {
    const nb = span('pv-tc-badge ' + pvLevelClass(tc.nivel));
    nb.textContent = tc.nivel;
    bR.appendChild(nb);
  }
  if (tc.tipoTC) {
    const tb = span('pv-tc-badge ' + pvTipoClass(tc.tipoTC));
    tb.textContent = tc.tipoTC;
    bR.appendChild(tb);
  }
  band.appendChild(bL);
  band.appendChild(bR);
  wrap.appendChild(band);

  const body = div('pv-tc-body');

  if (tc.objetivo) {
    body.appendChild(p('pv-section-title', 'Objetivo'));
    body.appendChild(p('pv-section-text', tc.objetivo));
  }

  const precs = Array.isArray(tc.precondiciones) ? tc.precondiciones : [];
  if (precs.length) {
    body.appendChild(p('pv-section-title', 'Precondiciones'));
    const ul = document.createElement('ul');
    ul.className = 'pv-prec-list';
    precs.forEach(pr => {
      const li = document.createElement('li');
      li.textContent = typeof pr === 'string' ? pr : (pr.texto || JSON.stringify(pr));
      ul.appendChild(li);
    });
    body.appendChild(ul);
  }

  const pasos = Array.isArray(tc.procedimiento) ? tc.procedimiento : [];
  if (pasos.length) {
    body.appendChild(p('pv-section-title', 'Procedimiento'));
    const tbl = document.createElement('table');
    tbl.className = 'pv-steps-tbl';
    tbl.innerHTML = '<thead><tr><th class="pv-step-num">Paso</th><th>Instrucción</th><th>Resultado esperado</th></tr></thead>';
    const tbody = document.createElement('tbody');
    pasos.forEach((paso, i) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td class="pv-step-num">${paso.paso || (i + 1)}</td><td>${escHtml(paso.instruccion || '')}</td><td class="pv-step-res">${escHtml(paso.resultadoEsperado || '')}</td>`;
      tbody.appendChild(tr);
    });
    tbl.appendChild(tbody);
    body.appendChild(tbl);
  }

  wrap.appendChild(body);

  if (tc.criterioAceptacion) {
    const box = div('pv-crit-box');
    box.innerHTML = `<div class="pv-crit-title">Criterio de aceptación</div><p class="pv-crit-text">${escHtml(tc.criterioAceptacion)}</p>`;
    wrap.appendChild(box);
  } else if (Array.isArray(tc.criterios) && tc.criterios.length) {
    const box = div('pv-crit-box');
    const ul = document.createElement('ul');
    ul.style.cssText = 'padding-left:16px;margin:0';
    tc.criterios.forEach(c => { const li = document.createElement('li'); li.style.cssText = 'font-size:11px;color:#78350F;line-height:1.55'; li.textContent = c; ul.appendChild(li); });
    box.innerHTML = `<div class="pv-crit-title">Criterios de aceptación</div>`;
    box.appendChild(ul);
    wrap.appendChild(box);
  }

  if (tc.evidenciaEsperada) {
    const evBox = div('pv-crit-box');
    evBox.style.cssText = evBox.style.cssText + ';background:#EBF5FB;border-color:#3498DB;border-left-color:#2980B9';
    evBox.innerHTML = `<div class="pv-crit-title" style="color:#1A5276">Evidencia esperada</div><p class="pv-crit-text" style="color:#1A5276">${escHtml(tc.evidenciaEsperada)}</p>`;
    wrap.appendChild(evBox);
  }

  const foot = div('pv-tc-foot');
  if (tc.nivel) {
    const fi = div('pv-foot-item');
    fi.innerHTML = `<span class="pv-foot-label">Nivel:</span> <span class="pv-tc-badge ${pvLevelClass(tc.nivel)}">${escHtml(tc.nivel)}</span>`;
    foot.appendChild(fi);
  }
  if (tc.grupoFuncional || tc.grupo) {
    const fi = div('pv-foot-item');
    fi.innerHTML = `<span class="pv-foot-label">Grupo:</span> ${escHtml(tc.grupoFuncional || tc.grupo)}`;
    foot.appendChild(fi);
  }
  if (tc.raVinculado) {
    const fi = div('pv-foot-item');
    fi.innerHTML = `<span class="pv-foot-label">RA:</span> <span class="pv-foot-tag pv-foot-tag-ra">${escHtml(tc.raVinculado)}</span>`;
    foot.appendChild(fi);
  }
  const ursArr = Array.isArray(tc.ursVinculados) ? tc.ursVinculados : [];
  if (ursArr.length) {
    const fi = div('pv-foot-item');
    fi.innerHTML = `<span class="pv-foot-label">URS:</span> ${ursArr.map(u => `<span class="pv-foot-tag">${escHtml(String(u))}</span>`).join(' ')}`;
    foot.appendChild(fi);
  }
  if (tc.rpn != null) {
    const fi = div('pv-foot-item');
    fi.innerHTML = `<span class="pv-foot-label">RPN:</span> <span class="pv-foot-tag pv-foot-tag-rpn">${tc.rpn}</span>`;
    foot.appendChild(fi);
  }
  if (foot.children.length) wrap.appendChild(foot);

  return wrap;
}

function buildPrintTrazeCard(tc) {
  const ursArr = Array.isArray(tc.ursVinculados) ? tc.ursVinculados : [];
  const raVal  = tc.raVinculado || '';
  if (!ursArr.length && !raVal) return null;

  const wrap = div('');

  const hdr = div('pv-traza-hdr');
  hdr.textContent = 'TRAZABILIDAD CRUZADA';
  wrap.appendChild(hdr);

  const body = div('pv-traza-body');

  ursArr.forEach(ursId => {
    const ursInfo = findUrsReq(String(ursId));
    const rc = div('pv-req-card');
    const row = div('pv-req-row');
    row.innerHTML = `<span class="pv-req-badge">URS</span><span class="pv-req-id">${escHtml(String(ursId))}</span>`;
    if (ursInfo && ursInfo.criticidad) {
      const nlbl = span('pv-req-nivel');
      nlbl.textContent = ursInfo.criticidad;
      row.appendChild(nlbl);
    }
    rc.appendChild(row);
    if (ursInfo && ursInfo.descripcion) rc.appendChild(p('pv-req-desc', ursInfo.descripcion));
    rc.appendChild(p('pv-req-origin', 'Origen: ' + (ursInfo ? (ursInfo.docCode || 'URS') : 'URS')));
    body.appendChild(rc);
  });

  if (raVal) {
    const raInfo = findRaRisk(raVal);
    const rc = div('pv-req-card ra');
    const row = div('pv-req-row');
    row.innerHTML = `<span class="pv-req-badge ra">RA</span><span class="pv-req-id">${escHtml(raVal)}</span>`;
    rc.appendChild(row);
    if (raInfo && raInfo.descripcion) rc.appendChild(p('pv-req-desc', raInfo.descripcion));
    rc.appendChild(p('pv-req-origin', 'Origen: ' + (raInfo ? (raInfo.docCode || 'RA') : 'RA')));
    body.appendChild(rc);
  }

  wrap.appendChild(body);
  return wrap;
}

function pvLevelClass(nivel) {
  const n = (nivel || '').toUpperCase();
  if (n.includes('CRÍT') || n.includes('CRIT')) return 'pv-b-critico';
  if (n === 'ALTO')  return 'pv-b-alto';
  if (n === 'MEDIO') return 'pv-b-medio';
  if (n === 'BAJO')  return 'pv-b-bajo';
  return 'pv-b-default';
}

function pvTipoClass(tipo) {
  const t = (tipo || '').toUpperCase();
  if (t === 'POSITIVO') return 'pv-b-positivo';
  if (t === 'NEGATIVO') return 'pv-b-negativo';
  return 'pv-b-default';
}
</script>
